version: '3.8'

services:
  # Infrastructure Services
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  postgres-event:
    image: postgres:15-alpine
    container_name: postgres-event
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVENT_DB}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${EVENT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  postgres-audit:
    image: postgres:15-alpine
    container_name: postgres-audit
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUDIT_DB}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUDIT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181", "|", "grep", "imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler-network

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      cub kafka-ready -b kafka:29092 1 30 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic meeting.created &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic meeting.updated &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic meeting.cancelled &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic rsvp.updated &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic reminder.trigger &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic audit.log &&
      echo 'Successfully created topics.'
      "
    networks:
      - scheduler-network

  # Spring Boot Microservices
  config-server:
    image: yourusername/config-server:latest
    container_name: config-server
    mem_limit: 300m
    ports:
      - "8888:8888"
    depends_on:
      - redis
    networks:
      - scheduler-network

  eureka-server:
    image: yourusername/eureka-server:latest
    container_name: eureka-server
    mem_limit: 300m
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - scheduler-network

  api-gateway:
    image: yourusername/api-gateway:latest
    container_name: api-gateway
    mem_limit: 300m
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - redis
    networks:
      - scheduler-network

  auth-service:
    image: yourusername/auth-service:latest
    container_name: auth-service
    mem_limit: 300m
    ports:
      - "8081:8081"
    depends_on:
      - postgres-auth
      - config-server
      - eureka-server
      - redis
    networks:
      - scheduler-network

  user-service:
    image: yourusername/user-service:latest
    container_name: user-service
    mem_limit: 300m
    ports:
      - "8082:8082"
    depends_on:
      - postgres-user
      - config-server
      - eureka-server
    networks:
      - scheduler-network

  event-service:
    image: yourusername/event-service:latest
    container_name: event-service
    mem_limit: 300m
    ports:
      - "8083:8083"
    depends_on:
      - postgres-event
      - config-server
      - eureka-server
      - kafka
    networks:
      - scheduler-network

  availability-service:
    image: yourusername/availability-service:latest
    container_name: availability-service
    mem_limit: 300m
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - eureka-server
      - redis
    networks:
      - scheduler-network

  notification-service:
    image: yourusername/notification-service:latest
    container_name: notification-service
    mem_limit: 300m
    ports:
      - "8085:8085"
    depends_on:
      - config-server
      - eureka-server
      - kafka
    networks:
      - scheduler-network

  reminder-service:
    image: yourusername/reminder-service:latest
    container_name: reminder-service
    mem_limit: 300m
    ports:
      - "8086:8086"
    depends_on:
      - config-server
      - eureka-server
      - redis
      - kafka
    networks:
      - scheduler-network

  audit-service:
    image: yourusername/audit-service:latest
    container_name: audit-service
    mem_limit: 300m
    ports:
      - "8087:8087"
    depends_on:
      - postgres-audit
      - config-server
      - eureka-server
      - kafka
    networks:
      - scheduler-network

  # Frontend
  frontend:
    image: yourusername/frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - scheduler-network

networks:
  scheduler-network:
    driver: bridge
